<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة النتائج ولجنة الرأفة</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white text-center">
                        <h3 class="mb-0">نظام إدارة النتائج ولجنة الرأفة</h3>
                    </div>
                    <div class="card-body">
                        
                        <div id="errorBox" class="alert alert-danger d-none" role="alert"></div>

                        <div class="mb-3">
                            <label for="studentName" class="form-label">اسم الطالب:</label>
                            <input type="text" id="studentName" class="form-control" placeholder="أدخل اسم الطالب">
                        </div>

                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label for="sub1" class="form-label">درجة المادة الأولى:</label>
                                <input type="number" id="sub1" class="form-control" placeholder="0-100">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="sub2" class="form-label">درجة المادة الثانية:</label>
                                <input type="number" id="sub2" class="form-control" placeholder="0-100">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="sub3" class="form-label">درجة المادة الثالثة:</label>
                                <input type="number" id="sub3" class="form-control" placeholder="0-100">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="attendance" class="form-label">نسبة الحضور (%):</label>
                            <input type="number" id="attendance" class="form-control" placeholder="0-100">
                        </div>

                        <button id="addBtn" class="btn btn-success w-100 mb-2">إضافة طالب</button>

                    </div>
                </div>

                <div class="card shadow-sm mt-4">
                    <div class="card-body">
                        <h5 class="mb-3">قائمة الطلاب المسجلين:</h5>
                        <div id="studentsListBox">
                            <p class="text-muted mb-0">لم يتم إضافة طلاب بعد...</p>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
